<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Terraria Weapons Gallery</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <style>
    body {
      background-color: #1b2a1b;
    }

    .card {
      min-height: 100px;
      background-color: #3d5a2a;
      color: white;
    }

    .card img {
      width: 100%;
      height: 150px;
      object-fit: contain;
    }

    .h-100 img {
      height: 300px;
    }
  </style>
</head>

<body>
  <div class="container-fluid p-3">
    <div class="row">
      <div class="col-2 p-1">
        <div class="card p-1">
          <img src="assets/images/A-Copper-Shortsword.png" class="img-fluid" alt="Copper Shortsword">
          Copper Shortsword
        </div>
      </div>
      <div class="col-2 p-1">
        <div class="card p-1">
          <img src="assets/images/Muramasa.webp" class="img-fluid" alt="Muramasa">
          Muramasa
        </div>
      </div>
      <div class="col-2 p-1">
        <div class="card p-1">
          <img src="assets/images/391960bae6d59c0.webp" class="img-fluid" alt="Starfury">
          Starfury
        </div>
      </div>
      <div class="col-3 p-1">
        <div class="card p-1">
          <img src="assets/images/141194.jpg" class="img-fluid" alt="Night's Edge">
          Night's Edge
        </div>
      </div>
      <div class="col-3 p-1">
        <div class="card p-1">
          <img src="assets/images/TerraBlade.webp" class="img-fluid" alt="Terra Blade">
          Terra Blade
        </div>
      </div>
    </div>
    <div class="row">
      <div class="col-4">
        <div class="row">
          <div class="col-12 p-1">
            <div class="card p-1">
              <img src="assets/images/00fb897674face9.webp" class="img-fluid" alt="Megashark">
              Megashark
            </div>
          </div>
        </div>
        <div class="row">
          <div class="col-6 p-1">
            <div class="card p-1">
              <img src="assets/images/phx.png" class="img-fluid" alt="Phoenix Blaster">
              Phoenix Blaster
            </div>
          </div>
          <div class="col-6 p-1">
            <div class="card p-1">
              <img src="assets/images/3696cksyndi71.png" class="img-fluid" alt="Minishark">
              Minishark
            </div>
          </div>
        </div>
      </div>
      <div class="col-5 p-1">
        <div class="card p-1 h-100">
          <img src="assets/images/ZenithTerraria.webp" class="img-fluid" alt="Zenith">
          Zenith
        </div>
      </div>
      <div class="col-3">
        <div class="row h-100">
          <div class="col-6 p-1">
            <div class="card p-1 h-100">
              <img src="assets/images/sr2d5dcaf049f82.webp" class="img-fluid" alt="Meowmere">
              Meowmere
            </div>
          </div>
          <div class="col-6 p-1">
            <div class="card p-1 h-100">
              <img src="assets/images/o81taukdu3y51.png" class="img-fluid" alt="Star Wrath">
              Star Wrath
            </div>
          </div>
        </div>
      </div>
    </div>
    <div class="row">
      <div class="col-4 p-1">
        <div class="card p-1">
          <img src="assets/images/Terraria-Last-Prism.png" class="img-fluid" alt="Last Prism">
          Last Prism
        </div>
      </div>
      <div class="col-5 p-1">
        <div class="card p-1">
          <img src="assets/images/vbx.png" class="img-fluid" alt="Vortex Beater">
          Vortex Beater
        </div>
      </div>
      <div class="col-3 p-1">
        <div class="card p-1">
          <img src="assets/images/Screenshot_2026-10-10_154844-removebg-preview.png" class="img-fluid" alt="Rainbow Rod">
          Rainbow Rod
        </div>
      </div>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
    crossorigin="anonymous"></script>
</body>

</html>
